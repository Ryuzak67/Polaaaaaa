<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pollería El Dorado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f0f0f;
            color: #fff;
        }

        header {
            background: #111;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ffcc00;
        }

        header h1 {
            color: #ffcc00;
            margin: 0;
        }

        .hero {
            text-align: center;
            padding: 30px;
        }

        .hero img {
            width: 90%;
            max-width: 700px;
            border-radius: 10px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
        }

        .card {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 10px;
            width: 250px;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
        }

        .card h3 {
            color: #ffcc00;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #111;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🍗 Pollería El Dorado</h1>
</header>

<div class="hero">
    <h2>El mejor pollo a la brasa</h2>
    <img src="https://images.pexels.com/photos/1565982/pexels-photo-1565982.jpeg" alt="pollo a la brasa">
</div>

<div class="menu">

    <div class="card">
        <img src="https://images.pexels.com/photos/2338407/pexels-photo-2338407.jpeg">
        <h3>Pollo a la Brasa</h3>
        <p>S/ 35</p>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/1639562/pexels-photo-1639562.jpeg">
        <h3>Pollo Broaster</h3>
        <p>S/ 18</p>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/70497/pexels-photo-70497.jpeg">
        <h3>Salchipapa</h3>
        <p>S/ 10</p>
    </div>

</div>

<footer>
    © 2026 Pollería El Dorado
</footer>

</body>
</html>
